name: Android APK
on:
  push:
    branches: [android-hybrid]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare bundled game and validate
        run: python3 android/prepare.py
      - name: Verify hybrid ranking and original game
        run: node --test android/tests/*.test.cjs tests/wo.test.cjs tests/german.test.cjs tests/mobile-audio.test.cjs tests/mobile-performance.test.cjs tests/ranking.test.cjs
      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Package unsigned release and signing tool
        run: |
          mkdir -p android/release
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/release/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android/release/
      - uses: actions/upload-artifact@v4
        with:
          name: WO-Fighters-Android
          path: android/release/
          retention-days: 90

