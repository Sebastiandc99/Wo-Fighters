plugins { id 'com.android.application' }
android {
    namespace 'com.sebastiandc.wofighters'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sebastiandc.wofighters'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    buildTypes {
        debug { debuggable false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += ['webp','png','jpg','mp3','wav','ogg','woff'] }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }

